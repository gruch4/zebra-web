[project]
name = "zebra-web"
version = "1.1.2"
description = "Self-hosted web UI for Zebra label printers"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "pdf417gen>=0.8.1",
    "pillow>=13.0.0",
    "ppf-datamatrix>=0.2",
    "pydantic-settings>=2.15.0",
    "python-barcode>=0.16.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/gruch4/zebra-web"
Issues = "https://github.com/gruch4/zebra-web/issues"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
