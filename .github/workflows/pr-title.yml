name: PR title

# Pull requests are squash-merged with their title as the commit message, and release-please builds
# the version number and changelog from those messages, so titles must follow Conventional
# Commits: `feat: …`, `fix(renderer): …`, `docs: …`, `feat!: …` for breaking changes.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
