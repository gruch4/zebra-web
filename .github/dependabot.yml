# Dependency updates. Commit prefixes matter: release-please makes a patch release for `fix(deps)`
# (runtime dependencies and base images, which end up in the published image) and none for
# `chore(...)` / `ci(...)`.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, python]
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, javascript]
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: fix(deps)
    ignore:
      # Stay on the Node.js / Python release lines the project targets; move them on purpose.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: chore(deps)
    ignore:
      # A new PostgreSQL major version cannot read the old data directory: upgrade by hand.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
